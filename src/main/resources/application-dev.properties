server.port=8098

spring.application.name=todo-app-service

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

#####################DEBUGING##########################
logging.level.com.zaxxer.hikari.pool.HikariPool=TRACE
logging.level.com.todo.app.service.mapper=DEBUG

########################### Database Properties ###############################
spring.datasource.jdbc-url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.leakDetectionThreshold=${SPRING_DATASOURCE_HIKARI_LEAK_THRESHOLD}
spring.datasource.connectionTimeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}
spring.datasource.idleTimeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT}
spring.datasource.maxLifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME}
spring.datasource.minimumIdle=${SPRING_DATASOURCE_HIKARI_MIN_IDLE}
spring.datasource.maximumPoolSize=${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE}

############################ MyBatis Properties ################################
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL
mybatis.mapper-locations=classpath:**/mapper/*.xml